    <!--
      Purge stale service-workers from older deployments.
      This inline script runs before the app bundle so that a rogue SW
      from a previous version can never block the fresh JS/CSS from loading.
    -->
    <script>
      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistrations().then(function(rs){
          rs.forEach(function(r){r.unregister()});
        });
        caches.keys().then(function(ks){
          ks.forEach(function(k){
            if(k.startsWith('flame-'))caches.delete(k);
          });
        });
      }
    </script>
